name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: admin,
            POSTGRES_PASSWORD: admin123,
            POSTGRES_DB: admin,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U admin" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: services/api } }
    env:
      DATABASE_URL: postgresql+psycopg://admin:admin123@localhost:5432/admin
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Migrations apply cleanly and match models
        run: alembic upgrade head && alembic check
      - name: Unit + integration + contract + security tests
        run: pytest
      - name: OpenAPI contract has no uncommitted drift
        run: python scripts/export_openapi.py && git diff --exit-code ../../packages/contracts/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "20",
            cache: npm,
            cache-dependency-path: apps/web/package-lock.json,
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot full stack
        run: cp .env.example .env && docker compose up -d --build --wait postgres redis migrate api worker web
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            compose.log
            apps/web/test-results

  images:
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (push to your registry when cloud deployment begins)
        run: |
          docker build -f infra/docker/api.Dockerfile -t sfai-api:${{ github.sha }} services/api
          docker build -f infra/docker/web.Dockerfile -t sfai-web:${{ github.sha }} apps/web
